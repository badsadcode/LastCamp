<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Camp Protocol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Last Camp Protocol</h1>
    </header>

    <div id="resource-bar" class="resource-bar">
        <!-- Resource bar will be rendered here -->
    </div>

    <main class="main-content">
        <section id="survivor-panel" class="panel">
            <h2>Survivors</h2>
            <div id="survivor-list">
                <!-- Survivors will be rendered here -->
            </div>
        </section>

        <section id="camp-panel" class="panel">
            <h2>Camp Buildings</h2>
            <div id="building-list">
                <!-- Buildings will be rendered here -->
            </div>

            <h2 style="margin-top: 2rem;">Missions</h2>
            <div id="mission-list">
                <!-- Missions will be rendered here -->
            </div>
            <h3>Active Missions</h3>
            <div id="active-mission-list">
                <!-- Active missions will be rendered here -->
            </div>
        </section>

        <section id="actions-panel" class="panel">
            <h2>Actions</h2>
            <button id="end-day-btn" class="action-btn" style="margin-bottom: 0.5rem;">End Day</button>

            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <button id="new-game-btn" class="action-btn" style="flex: 1; font-size: 0.8rem;">New</button>
                <button id="save-game-btn" class="action-btn" style="flex: 1; font-size: 0.8rem;">Save</button>
                <button id="load-game-btn" class="action-btn" style="flex: 1; font-size: 0.8rem;">Load</button>
                <button id="delete-save-btn" class="action-btn" style="flex: 1; font-size: 0.8rem; background-color: #f44336;">Del</button>
            </div>

            <div id="log-area" class="log-area">
                <h3>Daily Report</h3>
                <ul id="log-list">
                    <!-- Logs will be rendered here -->
                </ul>
            </div>
        </section>
    </main>

    <!-- Event Modal -->
    <div id="event-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div class="panel survivor-card" style="max-width: 600px; width: 100%; margin: 2rem; background-color: var(--panel-bg);">
            <h2 id="event-title" style="color: var(--accent-color);">Event Title</h2>
            <p id="event-description">Event description goes here...</p>
            <div id="event-choices" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.5rem;">
                <!-- Choices rendered here -->
            </div>
        </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/balance.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/missions.js"></script>
    <script src="js/events.js"></script>
    <script src="js/raids.js"></script>
    <script src="js/save.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
