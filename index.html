<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Camp Protocol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Last Camp Protocol</h1>
    </header>

    <div id="resource-bar" class="resource-bar">
        <!-- Resource bar will be rendered here -->
    </div>

    <main class="main-content">
        <section id="survivor-panel" class="panel">
            <h2>Survivors</h2>
            <div id="survivor-list">
                <!-- Survivors will be rendered here -->
            </div>
        </section>

        <section id="actions-panel" class="panel">
            <h2>Actions</h2>
            <button id="end-day-btn" class="action-btn">End Day</button>
            <div id="log-area" class="log-area">
                <h3>Daily Report</h3>
                <ul id="log-list">
                    <!-- Logs will be rendered here -->
                </ul>
            </div>
        </section>
    </main>

    <script src="js/state.js"></script>
    <script src="js/save.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
